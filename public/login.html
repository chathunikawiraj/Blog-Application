<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fashion.Design - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700;800;900&family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
 <style>
    /*FULL-PAGE BACKGROUND*/
    body {
        background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), 
                    url('uploads/banner5.jpg') center/cover no-repeat fixed;
        background-size: cover;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        margin: 0;
    }

    /*OVERRIDE HEADER*/
    header {
        min-height: auto !important;
        height: auto !important;
        background: rgba(0, 0, 0, 0.7) !important;
        backdrop-filter: blur(5px);
    }

    /* HIDE THE LARGE BANNER*/
    .banner {
        display: none !important;
    }

    /*CENTER THE FORM*/
    .login-section {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 0;
    }

    .auth-container {
        width: 100%;
        max-width: 450px;
        padding: 2rem;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    }

    .auth-container h2 {
        font-family: 'Playfair Display', serif;
        text-align: center;
        margin-bottom: 1.5rem;
        color: #2b2b2b;
    }

    .auth-container input {
        width: 100%;
        padding: 0.8rem 1rem;
        margin-bottom: 1rem;
        border: 2px solid #eee;
        border-radius: 8px;
        font-size: 1rem;
        transition: border 0.3s;
        background: #fafafa;
    }

    .auth-container input:focus {
        border-color: #c9a96e;
        outline: none;
        background: #fff;
    }

    .auth-container .btn-submit {
        width: 100%;
        background: #2b2b2b;
        color: #fff;
        padding: 0.8rem;
        border: none;
        border-radius: 30px;
        font-size: 1.1rem;
        cursor: pointer;
        transition: 0.3s;
    }

    .auth-container .btn-submit:hover {
        background: #c9a96e;
    }

    .auth-container .auth-link {
        text-align: center;
        margin-top: 1rem;
    }

    .auth-container .auth-link a {
        color: #2b2b2b;
        font-weight: 600;
        text-decoration: none;
    }

    .auth-container .auth-link a:hover {
        color: #c9a96e;
    }

    #loginError, #registerError {
        color: #e74c3c;
        text-align: center;
        margin-top: 0.5rem;
    }

    footer {
        margin-top: auto;
        background: rgba(0,0,0,0.7);
        backdrop-filter: blur(5px);
    }
</style>
</head>
<body>
    <!--HEADER / NAVIGATION-->
    <header>
        <nav class="navbar">
            <div class="container">
                <a href="index.html" class="navbar-brand">Fashion.Design</a>
                <div class="navbar-nav">
                    <a href="index.html">Home</a>
                    <a href="login.html">Login</a>
                    <a href="register.html">Register</a>
                </div>
            </div>
        </nav>
    </header>

    <!--LOGIN FORM - CENTERED-->
    <section class="login-section" style="display:flex; align-items:center; justify-content:center; min-height:70vh; padding:2rem 0;">
    <div class="container">
        <div class="auth-container">
            <h2>Welcome Back</h2>
            <form id="loginForm">
                <input type="email" id="email" placeholder="Email Address" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit" class="btn-submit">Login</button>
                <div id="loginError"></div>
            </form>
            <div class="auth-link">
                Don't have an account? <a href="register.html">Register</a>
            </div>
        </div>
    </div>
</section>
    <!--FOOTER-->
    <footer>
        <div class="social-links">
            <a href="#"><i class="fab fa-facebook-f"></i></a>
            <a href="#"><i class="fab fa-twitter"></i></a>
            <a href="#"><i class="fab fa-instagram"></i></a>
            <a href="#"><i class="fab fa-pinterest"></i></a>
        </div>
        <span>&copy; 2026 Fashion.Design Blog | All Rights Reserved</span>
    </footer>

    <script src="js/app.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('loginError');
            const submitBtn = document.querySelector('.btn-submit');
            
            errorDiv.textContent = '';

            try {
                submitBtn.textContent = 'Logging in...';
                submitBtn.disabled = true;
                submitBtn.style.opacity = '0.7';

                const data = await fetchAPI('auth.php?action=login', {
                    method: 'POST',
                    body: { email, password }
                });
                
                setUser({ id: data.id, username: data.username });
                window.location.href = 'index.html';
            } catch (err) {
                submitBtn.textContent = 'Login';
                submitBtn.disabled = false;
                submitBtn.style.opacity = '1';
                errorDiv.textContent = err.message || 'Login failed. Please try again.';
            }
        });
    </script>
</body>
</html>
