<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Blogs – Fashion.Design</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700;800;900&family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* ===== FULL PAGE STYLES ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f8f0ec;
            font-family: 'Quicksand', sans-serif;
            min-height: 100vh;
        }

        /* ===== HEADER – MATCH HOME ===== */
        /* ===== HEADER – MATCH OTHER PAGES ===== */
header {
    background: #2b2b2b !important;
    min-height: auto !important;
    padding: 0 !important;
}

.navbar {
    background: #2b2b2b !important;
    padding: 1.2rem !important;
}

.navbar .container {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    max-width: 1320px;
    margin: 0 auto;
    padding: 0 1.2rem;
}
        .navbar-brand {
            color: #fff;
            font-size: 2rem;
            text-decoration: none;
            font-family: 'Playfair Display', serif;
            letter-spacing: 2px;
        }
        .navbar-brand span {
            color: #c9a96e;
        }
        .navbar-nav {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .navbar-nav a {
            text-transform: uppercase;
            font-weight: 500;
            color: #fff;
            text-decoration: none;
            padding: 0.4rem 0.8rem;
            letter-spacing: 2px;
            transition: opacity 0.3s ease;
            font-size: 0.9rem;
        }
        .navbar-nav a:hover {
            opacity: 0.7;
            color: #c9a96e;
        }
        #usernameDisplay {
            color: #c9a96e;
            font-weight: 600;
        }
        #logoutBtn {
            color: #e74c3c;
        }

        /* ===== ALL BLOGS SECTION ===== */
        .all-blogs-section {
            max-width: 1200px;
            margin: 3rem auto;
            padding: 0 2rem;
        }

        .all-blogs-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .all-blogs-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.8rem;
            color: #2b2b2b;
        }

        .all-blogs-header p {
            color: #888;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 0.9rem;
        }

        .all-blogs-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
            max-width: 900px;
            margin: 0 auto;
        }

        .blog-list-item {
            background: #fff;
            padding: 1.5rem 2rem;
            border-radius: 12px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.04);
            transition: all 0.3s ease;
            border-left: 4px solid #c9a96e;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .blog-list-item:hover {
            transform: translateX(8px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }

        .blog-list-item .blog-info {
            flex: 1;
        }

        .blog-list-item .blog-info .blog-title {
            font-size: 1.3rem;
            font-family: 'Playfair Display', serif;
            color: #2b2b2b;
            text-decoration: none;
            transition: color 0.3s;
        }

        .blog-list-item .blog-info .blog-title:hover {
            color: #c9a96e;
        }

        .blog-list-item .blog-info .blog-meta {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-top: 0.3rem;
            font-size: 0.85rem;
            color: #888;
        }

        .blog-list-item .blog-info .blog-meta .author {
            color: #2b2b2b;
            font-weight: 600;
        }

        .blog-list-item .blog-info .blog-meta .date {
            color: #aaa;
        }

        .blog-list-item .blog-excerpt {
            color: #666;
            font-size: 0.95rem;
            margin-top: 0.5rem;
            line-height: 1.6;
        }

        .blog-list-item .read-link {
            background: #2b2b2b;
            color: #fff;
            padding: 0.5rem 1.5rem;
            border-radius: 30px;
            text-decoration: none;
            font-size: 0.85rem;
            transition: 0.3s;
            white-space: nowrap;
            margin-left: 1rem;
        }

        .blog-list-item .read-link:hover {
            background: #c9a96e;
            transform: scale(1.02);
        }

        /* ===== PAGINATION ===== */
        .pagination-wrapper {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 2.5rem;
            flex-wrap: wrap;
        }

        .pagination-wrapper button {
            background: #eee;
            color: #333;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: 500;
        }

        .pagination-wrapper button.active {
            background: #c9a96e;
            color: #fff;
        }

        .pagination-wrapper button:hover:not(.active) {
            background: #ddd;
        }

        .pagination-wrapper button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* ===== LOADING / EMPTY ===== */
        .loading-state {
            text-align: center;
            padding: 3rem;
            color: #888;
        }

        .loading-state i {
            font-size: 2rem;
            color: #c9a96e;
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #aaa;
        }

        /* ===== BACK BUTTON ===== */
        .back-wrapper {
            text-align: center;
            margin-top: 2rem;
        }

        .btn-back {
            display: inline-block;
            background: transparent;
            color: #2b2b2b;
            padding: 0.6rem 2rem;
            border-radius: 30px;
            text-decoration: none;
            border: 1px solid #ddd;
            transition: 0.3s;
        }

        .btn-back:hover {
            background: #2b2b2b;
            color: #fff;
            border-color: #2b2b2b;
        }

        /* ===== FOOTER ===== */
        footer {
            background: #2b2b2b;
            color: #fff;
            text-align: center;
            padding: 2rem 0;
            margin-top: 3rem;
        }
        footer .social-links {
            display: flex;
            justify-content: center;
            gap: 0.8rem;
            margin-bottom: 1rem;
        }
        footer .social-links a {
            border: 2px solid rgba(255,255,255,0.15);
            color: rgba(255,255,255,0.5);
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            text-decoration: none;
            transition: 0.3s;
        }
        footer .social-links a:hover {
            background: #c9a96e;
            border-color: #c9a96e;
            color: #fff;
        }
        footer span {
            color: rgba(255,255,255,0.4);
            font-size: 0.9rem;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .navbar .container {
                flex-direction: column;
                gap: 0.8rem;
            }
            .navbar-nav {
                justify-content: center;
                gap: 0.5rem;
            }
            .navbar-nav a {
                font-size: 0.8rem;
                padding: 0.3rem 0.6rem;
            }
            .all-blogs-section {
                padding: 0 1rem;
            }
            .all-blogs-header h1 {
                font-size: 2rem;
            }
            .blog-list-item {
                flex-direction: column;
                align-items: flex-start;
                padding: 1.2rem;
            }
            .blog-list-item .read-link {
                margin-left: 0;
                margin-top: 0.8rem;
                align-self: flex-start;
            }
        }

        @media (max-width: 480px) {
            .all-blogs-header h1 {
                font-size: 1.5rem;
            }
            .blog-list-item {
                padding: 1rem;
            }
            .blog-list-item .blog-info .blog-title {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header>
        <nav class="navbar">
            <div class="container">
                <a href="index.html" class="navbar-brand">Fashion.<span>Design</span></a>
                <div class="navbar-nav">
                    <a href="index.html">Home</a>
                    <a href="editor.html" id="newPostLink" style="display:none;">New Post</a>
                    <span id="authLinks">
                        <a href="login.html">Login</a>
                        <a href="register.html">Register</a>
                    </span>
                    <span id="userInfo" style="display:none;">
                        <a href="#" id="usernameDisplay"></a>
                        <a href="#" id="logoutBtn">Logout</a>
                    </span>
                </div>
            </div>
        </nav>
    </header>

    <!-- ===== ALL BLOGS ===== -->
    <section class="all-blogs-section">
        <div class="all-blogs-header">
            <h1>All Blog Posts</h1>
            <p>explore every story from our community</p>
        </div>

        <div id="allBlogsList" class="all-blogs-grid">
            <div class="loading-state">
                <i class="fas fa-spinner fa-spin"></i>
                <p>Loading blogs...</p>
            </div>
        </div>

        <div class="pagination-wrapper" id="paginationWrapper"></div>
    </section>

    <!-- ===== BACK TO HOME ===== -->
    <div class="back-wrapper">
        <a href="index.html" class="btn-back">← Back to Home</a>
    </div>

    <!-- ===== FOOTER ===== -->
    <footer>
        <div class="social-links">
            <a href="#"><i class="fab fa-facebook-f"></i></a>
            <a href="#"><i class="fab fa-twitter"></i></a>
            <a href="#"><i class="fab fa-instagram"></i></a>
            <a href="#"><i class="fab fa-pinterest"></i></a>
        </div>
        <span>&copy; 2026 Fashion.Design Blog | All Rights Reserved</span>
    </footer>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="js/app.js?v=2"></script></script>
        <script>
        let currentPage = 1;
        const perPage = 10; // Show 10 blogs per page

        async function loadAllBlogs(page = 1) {
            const listContainer = document.getElementById('allBlogsList');
            const paginationWrapper = document.getElementById('paginationWrapper');

            // Show loading state
            listContainer.innerHTML = `
                <div class="loading-state" style="grid-column:1/-1;">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>Loading blogs...</p>
                </div>
            `;

            try {
                const data = await fetchAPI(`blog.php?action=list&page=${page}`);
                console.log("📦 All blogs data:", data);

                if (!data.blogs || data.blogs.length === 0) {
                    listContainer.innerHTML = `
                        <div class="empty-state" style="grid-column:1/-1;">
                            <i class="fas fa-pen-fancy" style="font-size:2rem; display:block; margin-bottom:0.5rem; color:#c9a96e;"></i>
                            <p>No blogs yet. Be the first to share your thoughts!</p>
                        </div>
                    `;
                    paginationWrapper.innerHTML = '';
                    return;
                }

                // Build blog list
                let html = '';
                data.blogs.forEach(blog => {
                    const excerpt = blog.excerpt || blog.content.substring(0, 120) + '...';
                    html += `
                        <div class="blog-list-item">
                            <div class="blog-info">
                                <a href="blog.html?id=${blog.id}" class="blog-title">${escapeHtml(blog.title)}</a>
                                <div class="blog-meta">
                                    <span class="author"><i class="far fa-user"></i> ${escapeHtml(blog.author)}</span>
                                    <span class="date"><i class="far fa-calendar-alt"></i> ${new Date(blog.created_at).toLocaleDateString()}</span>
                                </div>
                                <div class="blog-excerpt">${escapeHtml(excerpt)}</div>
                            </div>
                            <a href="blog.html?id=${blog.id}" class="read-link">Read More →</a>
                        </div>
                    `;
                });

                listContainer.innerHTML = html;

                // Build pagination
                const totalPages = Math.ceil(data.total / perPage);
                paginationWrapper.innerHTML = '';
                if (totalPages > 1) {
                    if (page > 1) {
                        const prevBtn = document.createElement('button');
                        prevBtn.textContent = '← Prev';
                        prevBtn.onclick = () => loadAllBlogs(page - 1);
                        paginationWrapper.appendChild(prevBtn);
                    }

                    for (let i = 1; i <= totalPages; i++) {
                        const btn = document.createElement('button');
                        btn.textContent = i;
                        if (i === page) btn.className = 'active';
                        btn.onclick = () => loadAllBlogs(i);
                        paginationWrapper.appendChild(btn);
                    }

                    if (page < totalPages) {
                        const nextBtn = document.createElement('button');
                        nextBtn.textContent = 'Next →';
                        nextBtn.onclick = () => loadAllBlogs(page + 1);
                        paginationWrapper.appendChild(nextBtn);
                    }
                }
            } catch (err) {
                console.error("❌ Error loading blogs:", err);
                listContainer.innerHTML = `
                    <div style="grid-column:1/-1; text-align:center; color:#e74c3c; padding:2rem;">
                        <i class="fas fa-exclamation-circle" style="font-size:2rem; display:block; margin-bottom:1rem;"></i>
                        Error: ${err.message}
                    </div>
                `;
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            loadAllBlogs(1);
        });
    </script>
</body>
</html>
