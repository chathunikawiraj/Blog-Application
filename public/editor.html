<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fashion.Design - Editor</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700;800;900&family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- ===== NAVIGATION ===== -->
    <header>
        <nav class="navbar">
            <div class="container">
                <a href="index.html" class="navbar-brand">Fashion.Design</a>
                <div class="navbar-nav">
                    <a href="index.html">Home</a>
                    <a href="editor.html" id="newPostLink">New Post</a>
                    <span id="authLinks">
                        <a href="login.html">Login</a>
                        <a href="register.html">Register</a>
                    </span>
                    <span id="userInfo" style="display:none;">
                        <a href="#" id="usernameDisplay" style="color: #1abc9c;"></a>
                        <a href="#" id="logoutBtn" style="color: #e74c3c;">Logout</a>
                    </span>
                </div>
            </div>
        </nav>
    </header>
    <!-- ===== END NAVIGATION ===== -->

    <!-- ===== EDITOR FORM ===== -->
    <section class="blog" id="blog" style="padding-top:2rem;">
        <div class="container">
            <div class="title">
                <h2 id="editorTitle">Create New Blog</h2>
                <p>share your thoughts with the world</p>
            </div>
            <form id="blogForm" style="max-width:900px; margin:0 auto;">
                <div style="margin-bottom:1.5rem;">
                    <input type="text" id="titleInput" placeholder="Blog Title" required style="width:100%; padding:0.8rem 1.2rem; font-size:1.2rem; border:2px solid #ddd; border-radius:8px;">
                </div>
                <div style="margin-bottom:1.5rem;">
                    <textarea id="markdownEditor"></textarea>
                </div>
                <div style="display:flex; gap:1rem; flex-wrap:wrap; justify-content:center;">
                    <button type="submit" id="saveBtn" style="background:#2b2b2b; color:#fff; padding:0.7rem 2.5rem; border:none; border-radius:30px; font-size:1rem; cursor:pointer; transition:0.3s;">Save</button>
                    <button type="button" id="cancelBtn" style="background:#ddd; color:#333; padding:0.7rem 2.5rem; border:none; border-radius:30px; font-size:1rem; cursor:pointer; transition:0.3s;">Cancel</button>
                </div>
            </form>
        </div>
    </section>
    <!-- ===== END EDITOR ===== -->

    <!-- ===== FOOTER ===== -->
    <footer>
        <div class="social-links">
            <a href="#"><i class="fab fa-facebook-f"></i></a>
            <a href="#"><i class="fab fa-twitter"></i></a>
            <a href="#"><i class="fab fa-instagram"></i></a>
            <a href="#"><i class="fab fa-pinterest"></i></a>
        </div>
        <span>&copy; 2026 Fashion.Design Blog | All Rights Reserved</span>
    </footer>
    <!-- ===== END FOOTER ===== -->

    <script src="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.js"></script>
    <script src="js/app.js"></script>
    <script src="js/editor.js"></script>
</body>
</html>
